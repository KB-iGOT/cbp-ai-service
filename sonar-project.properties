# Coverage settings for SonarQube. Project key, host and token come from the CI pipeline.
sonar.python.version=3.12

# Written by `pytest` (see [tool.pytest.ini_options] in pyproject.toml)
sonar.python.coverage.reportPaths=coverage.xml

# Test code is not production code: exclude it from coverage and duplication checks
sonar.coverage.exclusions=tests/**
sonar.cpd.exclusions=tests/**
