[project]
name = "cbp-ai-service"
version = "0.1.0"
description = "iGOT AI Driven CBP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "google-genai>=1.20.0,<2.0",
    "psycopg2-binary==2.9.9",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.9.1",
    "sqlalchemy[asyncio]==2.0.30",
    "uvicorn==0.30.1",
    "pypdf2>=3.0.1",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.5.0",
    "google-cloud-storage>=3.4.1",
    "asyncpg>=0.30.0",
    "jinja2>=3.1.6",
    "playwright>=1.56.0",
    "pwdlib[argon2]>=0.3.0",
    "aiohttp>=3.9.0",
    "pgvector>=0.4.2",
    "redis[asyncio]>=5.0.0",
    "bs4>=0.0.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Only needed when LLM_PROVIDER or LLM_EMBEDDING_PROVIDER is set to "langchain" —
# see src/services/llm/providers/langchain.py. Default provider (Gemini) does not need this.
langchain = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-vertexai>=2.0",
]
